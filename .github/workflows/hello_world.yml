# Hello World example for DTU biosustain and DTU bioengineering Data Club

name: Hello World example

on:
  push:

jobs:
  say-hello-world:
    runs-on: ubuntu-latest
    steps:
    - name: biosustain
      run: echo "Hello DTU biosustain!"
    - name: bioengineering
      run: echo "Hello DTU bioengineering!"

  install-and-use-cowsay:
   runs-on: ubuntu-latest
   steps:
   - name: install
     run: |
      pip install cowsay
   - name: use
     run: |
       cowsay -c cheese -t 'hey there'

    install-and-use-cowpy:
      runs-on: ubuntu-latest
      steps:
      - name: install
        run: |
         pip install cowpy
      - name: use
        run: |
          cowpy -c tux hi there

